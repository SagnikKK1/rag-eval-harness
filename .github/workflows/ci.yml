name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: |
          pip install ruff
          ruff check rag eval scripts app
      - name: Tests (no API key needed)
        run: pytest -q
      - name: Build index (FAISS + BM25)
        run: python scripts/build_index.py
      - name: Retrieval regression gate
        run: python scripts/run_eval.py --gate
