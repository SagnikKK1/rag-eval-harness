name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-v2-msmarco-minilm-l6-v2
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps   # exercise the packaging (console scripts, package data)
      - name: Lint
        run: |
          pip install ruff
          ruff check rag_eval app tests scripts
      - name: Tests (no API key needed)
        run: pytest -q
      - name: Build index (FAISS + BM25)
        run: python scripts/build_index.py
      - name: Retrieval regression gate
        run: python scripts/run_eval.py --gate
